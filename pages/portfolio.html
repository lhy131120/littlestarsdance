<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會員中心</title>
</head>

<body>
  <%- include('./layout/header', {isLogined: true}); -%>
  <main>
    <section class="py-11 py-lg-14">
      <div class="container">
        <div class="row">
          <div class="col">
            <nav>
              <div class="nav nav-tabs" id="nav-tab" role="tablist">
                <button class="nav-link active" id="personal-info-tab" data-bs-toggle="tab" data-bs-target="#personal-info" type="button" role="tab" aria-controls="personal-info" aria-selected="true">個人資料</button>
                <button class="nav-link" id="course-info-tab" data-bs-toggle="tab" data-bs-target="#course-info" type="button" role="tab" aria-controls="course-info" aria-selected="false">課程資訊</button>
                <button class="nav-link" id="message-info-tab" data-bs-toggle="tab" data-bs-target="#message-info" type="button" role="tab" aria-controls="message-info" aria-selected="false">訊息中心</button>
              </div>
            </nav>
            <div class="tab-content" id="nav-tabContent">
              <div class="tab-pane fade show active" id="personal-info" role="tabpanel" aria-labelledby="personal-info-tab" tabindex="0">個人資料</div>
              <div class="tab-pane fade" id="course-info" role="tabpanel" aria-labelledby="course-info-tab" tabindex="0">課程資訊</div>
              <div class="tab-pane fade" id="message-info" role="tabpanel" aria-labelledby="message-info-tab" tabindex="0">訊息中心</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <%- include('./layout/footer'); -%>
  <script type="module" src="../main.js"></script>
</body>

</html>
