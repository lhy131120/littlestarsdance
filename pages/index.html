<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首頁</title>
  </head>
  <body>
    <%- include('./layout/header'); -%>

    <main>
      <!-- home hero -->
      <section id="home-hero-wrap" class="home-hero-wrap w-100">
        <div class="swiper h-100 w-100">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <div
                class="h-100 w-100 overflow-hidden position-relative d-flex align-items-end align-items-lg-center"
              >
                <div class="container-fluid mw-1920p px-lg-11 px-xl-13">
                  <img
                    src="/assets/images/hero/hero-1.jpg"
                    class="position-absolute top-50 start-50 translate-middle w-100 h-100 object-fit-cover"
                    alt=""
                  />
                  <ul
                    class="list-unstyled mb-13 mb-lg-0 position-relative d-flex flex-column gap-4 gap-lg-6 z-2"
                  >
                    <li>
                      <span
                        class="d-inline-block px-5 px-lg-10 py-1 py-lg-3 fs-5 fs-lg-1 lh-lg-sm letter-spacing-15 bg-primary-500 text-white"
                        >通過舞蹈表達自我</span
                      >
                    </li>
                    <li>
                      <span
                        class="d-inline-block px-5 px-lg-10 py-1 py-lg-3 fs-5 fs-lg-1 lh-lg-sm letter-spacing-15 bg-primary-500 text-white"
                        >透過藝術表達建立自信</span
                      >
                    </li>
                    <li>
                      <button
                        class="btn btn-primary fs-6 fs-lg-2 px-lg-6 py-lg-4"
                        type="button"
                      >
                        <span>探索課程</span>
                      </button>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="swiper-slide">
              <div
                class="h-100 w-100 overflow-hidden position-relative d-flex align-items-end align-items-lg-center"
              >
                <div class="container-fluid mw-1920p px-lg-11 px-xl-13">
                  <img
                    src="/assets/images/hero/hero-2.jpg"
                    class="position-absolute top-50 start-50 translate-middle w-100 h-100 object-fit-cover"
                    alt=""
                  />
                  <ul
                    class="list-unstyled mb-13 mb-lg-0 position-relative d-flex flex-column gap-4 gap-lg-6 z-2"
                  >
                    <li>
                      <span
                        class="d-inline-block px-5 px-lg-10 py-1 py-lg-3 fs-5 fs-lg-1 lh-lg-sm letter-spacing-15 bg-primary-500 text-white"
                        >從第一步到精彩表演</span
                      >
                    </li>
                    <li>
                      <span
                        class="d-inline-block px-5 px-lg-10 py-1 py-lg-3 fs-5 fs-lg-1 lh-lg-sm letter-spacing-15 bg-primary-500 text-white"
                        >用愛心關懷培養小舞者</span
                      >
                    </li>
                    <li>
                      <button
                        class="btn btn-primary fs-6 fs-lg-2 px-lg-6 py-lg-4"
                        type="button"
                      >
                        <span>探索課程</span>
                      </button>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="swiper-slide">
              <div
                class="h-100 w-100 overflow-hidden position-relative d-flex align-items-end align-items-lg-center"
              >
                <div class="container-fluid mw-1920p px-lg-11 px-xl-13">
                  <img
                    src="/assets/images/hero/hero-3.jpg"
                    class="position-absolute top-50 start-50 translate-middle w-100 h-100 object-fit-cover"
                    alt=""
                  />
                  <ul
                    class="list-unstyled mb-13 mb-lg-0 position-relative d-flex flex-column gap-4 gap-lg-6 z-2"
                  >
                    <li>
                      <span
                        class="d-inline-block px-5 px-lg-10 py-1 py-lg-3 fs-5 fs-lg-1 lh-lg-sm letter-spacing-15 bg-primary-500 text-white"
                        >讓您的孩子在快樂中舞蹈</span
                      >
                    </li>
                    <li>
                      <span
                        class="d-inline-block px-5 px-lg-10 py-1 py-lg-3 fs-5 fs-lg-1 lh-lg-sm letter-spacing-15 bg-primary-500 text-white"
                        >3-16歲專業舞蹈教育</span
                      >
                    </li>
                    <li>
                      <button
                        class="btn btn-primary fs-6 fs-lg-2 px-lg-6 py-lg-4"
                        type="button"
                      >
                        <span>探索課程</span>
                      </button>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
          <div class="controller position-absolute w-100">
            <div
              class="mw-1920p mx-auto px-lg-11 px-xl-13 d-flex justify-content-between"
            >
              <button type="button" class="swiper-button-prev">上一頁</button>
              <button type="button" class="swiper-button-next">下一頁</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Hot course -->
      <section id="hot-course" class="py-11 py-lg-14">
        <div class="container">
          <h2 class="text-lg-center mb-4 fs-5 fs-lg-1">熱門課程</h2>
          <p class="text-lg-center mb-7 mb-lg-8 fs-6 fs-lg-4">
            適合年齡的舞蹈課程,旨在培養創造力和建立自信
          </p>
          <div class="row rows-col-1 rows-col-lg-3 g-5">
            <div class="col">
              <div class="card">
                <img
                  src="/assets/images/8.jpg"
                  class="card-img-top"
                  alt="..."
                />
                <div class="card-body">
                  <div>
                    <h5 class="card-title">幼兒芭蕾</h5>
                    <p class="card-text">
                      透過各種不同創意動作和想像遊戲溫和地介紹芭蕾基礎。
                    </p>
                  </div>
                  <ul class="list-unstyled">
                    <li>週六上午10:00</li>
                    <li>80元 / 月</li>
                    <li>小班教學</li>
                  </ul>
                  <a href="#" class="btn btn-primary mx-auto">Go somewhere</a>
                </div>
              </div>
            </div>
            <div class="col">2</div>
            <div class="col">3</div>
          </div>
        </div>
      </section>
    </main>

    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
  </body>
</html>
